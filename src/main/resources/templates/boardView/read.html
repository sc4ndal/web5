<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>read.html</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" type="text/css">
	<script>
		// 모든 리소스 로딩 완료 후에 함수 실행
		// window.onload = function () {
		// };
		
		// HTML 및 DOM 트리 파싱 완료 후 (HTML, JS만 대기)
		document.addEventListener('DOMContentLoaded', function () {
			// 1. 글 추천
			const likeBtn = document.querySelector('#likeBtn');
			if (likeBtn) {
				likeBtn.addEventListener('click', function () {
					const bNum = likeBtn.dataset.num;
					location.href = `/board/like/${bNum}`;
				});
			}
			// 2. 글 삭제
			const deleteBtn = document.querySelector('#deleteBtn');
			if (deleteBtn) {
				deleteBtn.addEventListener('click', function () {
					const bNum = deleteBtn.dataset.num;
					if (confirm("삭제하시겠습니까?")) {
						location.href = `/board/delete/${bNum}`;
					}
				});
			}
			// 3. 글 수정
			const updateBtn = document.querySelector('#updateBtn');
			if (updateBtn) {
				updateBtn.addEventListener('click', function () {
					const bNum = updateBtn.dataset.num;
					location.href = `/board/update/${bNum}`;
				});
			}
		});
		
	</script>
</head>
<body>
<header>
	<h1>[ 게시글 읽기 ]</h1>
</header>
<section>
	<table>
		<tr>
			<th style="width: 100px;">작성자</th>
			<td style="width: 400px;">
				<span th:text="|${board.memberName} (${board.memberId})|"></span>
			</td>
		</tr>
		<tr>
			<th>작성일</th>
			<td th:text="${#temporals.format(board.createDate, 'yy-MM-dd HH:mm:ss')}"></td>
		</tr>
		<tr>
			<th>수정일</th>
			<td th:text="${#temporals.format(board.updateDate, 'yy-MM-dd HH:mm:ss')}"></td>
		</tr>
		<tr>
			<th>조회수</th>
			<td th:text="${board.viewCount}"></td>
		</tr>
		<tr>
			<th>추천수</th>
			<td th:text="${board.likeCount}"></td>
		</tr>
		<tr>
			<th>제목</th>
			<td th:text="${board.title}"></td>
		</tr>
		<tr>
			<th>내용</th>
			<td th:text="${board.contents}"></td>
		</tr>
		<tr>
			<th>파일첨부</th>
			<td>
				<a th:href="@{/board/download(boardNum=${board.boardNum})}"
				   th:text="${board.originalName}"></a>
				<!--				이미지 미리보기 -->
				<th:block th:if="${board.originalName != null}"
				          th:with="fn=${#strings.toLowerCase(board.originalName)},
				                    isImg=${fn.matches('.*[.](png|jpg|jpeg|gif|webp)$')}">
					<th:block th:if="${isImg}">
						<div style="margin-top: 10px;">
							<img alt="첨부 이미지 미리보기"
							     style="max-width: 420px; width: 100%; border: 1px solid #ddd;"
							     th:onerror="alert('미리보기 이미지를 불러올 수 없습니다.');"
							     th:src="@{/board/preview(boardNum=${board.boardNum})}">
						</div>
					</th:block>
					<th:block th:unless="${isImg}">
						<div style="margin-top: 8px; color:#666;">
							(이미지 파일이 아니라 미리보기를 지원하지않습니다.)
						</div>
					</th:block>
				</th:block>
			</td>
		</tr>
	</table>
	<br>
	<div>
		<th:block sec:authorize="isAuthenticated()">
			<button id="likeBtn" th:data-num="${board.boardNum}">추천</button>
		</th:block>
		<th:block th:if="${#authentication.name == board.memberId}">
			<button id="deleteBtn" th:data-num="${board.boardNum}">삭제</button>
			<button id="updateBtn" th:data-num="${board.boardNum}">수정</button>
		</th:block>
	</div>
</section>
</body>
</html>

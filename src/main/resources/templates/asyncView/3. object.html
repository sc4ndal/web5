<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>3. object.html</title>
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			
			// JS-Object    vs  JSON
			// 1. 자바스크립트 객체
			const jsObject = {
				name: "홍길동",
				age: 25,
				isStudent: true
			};
			
			// 2. JSON 형태의 문자열
			const jsonString = '{"name": "홍길동", "age": 25, "isStudent": true}';
			
			// 3. 자바스크립트 객체를 JSON 문자열로 변환
			const convertedJson = JSON.stringify(jsObject);
			
			console.log("=== 1. 출력 비교 ===");
			console.log("JS 객체: ", jsObject);
			console.log("JSON 문자열: ", jsonString);
			
			console.log("=== 2. 데이터 타입 비교 ===");
			console.log("JS 객체 타입: ", typeof jsObject);
			console.log("JSON 문자열: ", typeof jsonString);
			
			console.log("=== 3. 속성 접근 비교 ===");
			console.log("JS 객체 속성 읽기: ", jsObject.name);
			console.log("JSON 속성 읽기: ", jsonString.name);
			
			
			//--------------------------------------------------
			// 1. 객체 보내기
			document.querySelector('.btn-send-obj').addEventListener('click', async () => {
				const student = {
					name: document.querySelector('.user-name').value,
					age: document.querySelector('.user-age').value
				};
				
				await fetch('/api/object/send', {
					method: 'POST',
					headers: {'Content-Type': 'application/json'},
					body: JSON.stringify(student)
				});
				alert('서버 콘솔을 확인하세요');
			});
			
			// 2. 객체 받기
			document.querySelector('.btn-receive-obj').addEventListener('click', async () => {
				const response = await fetch('/api/object/receive', {})
				const student = await response.json();
				
				document.querySelector('.res-get-obj').textContent
						= `받은 객체 -> 이름: ${student.name}, 나이: ${student.age}`;
				
			});
			
			// 3. 객체 주고 받기
			document.querySelector('.btn-exchange-obj').addEventListener('click', async () => {
				const resultArea = document.querySelector('.res-post-obj');
				const student = {
					name: document.querySelector('.ex-name').value,
					age: document.querySelector('.ex-age').value
				};
				
				try {
					const response = await fetch('/api/object/exchange', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json', // 보낼 데이터 타입
							'Accept': 'application/json'
						},      // 받을 데이터 타입
						body: JSON.stringify(student)
					});
					
					// 상태코드 200이 아니면?
					if (!response.ok) {
						const errorText = await response.text();
						throw new Error(errorText);
					}
					const studentData = await response.json();
					resultArea.textContent = `변경된 정보 -> 이름: ${studentData.name}, 나이: ${studentData.age}`;
					
				} catch (error) {
					console.error('에러 발생: ', error);
					resultArea.textContent = `변경 실패: ${error.message}`;
				}
				
			});
		});
	</script>
</head>
<body>
<header>
	<h1>[ 3. 객체(JSON) 데이터 ]</h1>
</header>
<div>
	<h3>1. 서버로 객체 보내기</h3>
	이름 : <input class="user-name" type="text" value="홍길동">
	나이 : <input class="user-age" type="number" value="20">
	<button class="btn-send-obj">보내기 (POST/JSON)</button>
</div>

<div>
	<h3>2. 서버에서 객체 받기</h3>
	<button class="btn-receive-obj">학생정보 가져오기 (GET)</button>
	<p class="res-get-obj"></p>
</div>

<div>
	<h3>3. 객체 주고받기</h3>
	이름: <input class="ex-name" type="text" value="이순신">
	나이: <input class="ex-age" type="number" value="40">
	<button class="btn-exchange-obj">데이터 변경 (POST/JSON)</button>
	<p class="res-post-obj"></p>
</div>
</body>
</html>
